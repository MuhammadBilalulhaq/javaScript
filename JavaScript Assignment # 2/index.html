<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-8 col-md-6 col-lg-4">

                <!-- Calculator Display -->
                <input 
                    type="text"
                    class="form-control mb-3 text-end calculator-display"
                    id="display"
                    placeholder="0"
                    readonly
                >

                <!-- Row 1 -->
                <div class="row g-2 mb-2">

                    <div class="col-3">
                        <button 
                            onclick="clearDisplay()" 
                            class="btn btn-danger w-100 calculator-btn">
                            C
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="deleteLast()" 
                            class="btn btn-secondary w-100 calculator-btn">
                            ←
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('%')" 
                            class="btn btn-warning w-100 calculator-btn">
                            %
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('/')" 
                            class="btn btn-warning w-100 calculator-btn">
                            ÷
                        </button>
                    </div>

                </div>


                <!-- Row 2 -->
                <div class="row g-2 mb-2">

                    <div class="col-3">
                        <button 
                            onclick="displayValue('7')" 
                            class="btn btn-primary w-100 calculator-btn">
                            7
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('8')" 
                            class="btn btn-primary w-100 calculator-btn">
                            8
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('9')" 
                            class="btn btn-primary w-100 calculator-btn">
                            9
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('*')" 
                            class="btn btn-warning w-100 calculator-btn">
                            ×
                        </button>
                    </div>

                </div>


                <!-- Row 3 -->
                <div class="row g-2 mb-2">

                    <div class="col-3">
                        <button 
                            onclick="displayValue('4')" 
                            class="btn btn-primary w-100 calculator-btn">
                            4
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('5')" 
                            class="btn btn-primary w-100 calculator-btn">
                            5
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('6')" 
                            class="btn btn-primary w-100 calculator-btn">
                            6
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('-')" 
                            class="btn btn-warning w-100 calculator-btn">
                            −
                        </button>
                    </div>

                </div>


                <!-- Row 4 -->
                <div class="row g-2 mb-2">

                    <div class="col-3">
                        <button 
                            onclick="displayValue('1')" 
                            class="btn btn-primary w-100 calculator-btn">
                            1
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('2')" 
                            class="btn btn-primary w-100 calculator-btn">
                            2
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('3')" 
                            class="btn btn-primary w-100 calculator-btn">
                            3
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('+')" 
                            class="btn btn-warning w-100 calculator-btn">
                            +
                        </button>
                    </div>

                </div>


                <!-- Row 5 -->
                <div class="row g-2">

                    <div class="col-3">
                        <button 
                            onclick="displayValue('0')" 
                            class="btn btn-primary w-100 calculator-btn">
                            0
                        </button>
                    </div>

                    <div class="col-3">
                        <button 
                            onclick="displayValue('.')" 
                            class="btn btn-primary w-100 calculator-btn">
                            .
                        </button>
                    </div>

                    <div class="col-6">
                        <button 
                            onclick="calculate()" 
                            class="btn btn-success w-100 calculator-btn">
                            =
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Your JavaScript -->
    <script src="./js/index.js"></script>

    <!-- Bootstrap JavaScript -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
